<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillSelector — 主窗口重设计</title>
<style>
  /* ── Apple design system tokens (bound verbatim) ─────────────────── */
  :root {
    --bg: #ffffff;
    --surface: #f5f5f7;
    --surface-warm: #fbfbfd;
    --fg: #1d1d1f;
    --fg-2: #424245;
    --muted: #6e6e73;
    --meta: #86868b;
    --border: #d2d2d7;
    --border-soft: #e8e8ed;
    --accent: #0071e3;
    --accent-on: #ffffff;
    --accent-hover: #0077ed;
    --accent-active: #0066cc;
    --success: #16a34a;
    --warn:    #eab308;
    --danger:  #dc2626;
    --font-display:
      "SF Pro Display", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-body:
      "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono:
      "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
    --text-xs:   12px;
    --text-sm:   14px;
    --text-base: 17px;
    --text-lg:   21px;
    --text-xl:   28px;
    --text-2xl:  40px;
    --text-3xl:  56px;
    --text-4xl:  80px;
    --leading-body:  1.47;
    --leading-tight: 1.05;
    --tracking-display: -0.015em;
    --space-1:  4px;
    --space-2:  8px;
    --space-3:  12px;
    --space-4:  16px;
    --space-5:  20px;
    --space-6:  24px;
    --space-8:  32px;
    --space-12: 48px;
    --section-y-desktop: 100px;
    --section-y-tablet:  64px;
    --section-y-phone:   40px;
    --radius-sm:   8px;
    --radius-md:   12px;
    --radius-lg:   18px;
    --radius-pill: 980px;
    --elev-flat:   none;
    --elev-ring:   0 0 0 1px var(--border);
    --elev-raised: 0 12px 32px rgba(0, 0, 0, 0.08);
    --focus-ring: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 65%);
    --motion-fast:   150ms;
    --motion-base:   220ms;
    --ease-standard: cubic-bezier(0.28, 0, 0.22, 1);
    --container-max:            1024px;
    --container-gutter-desktop: 22px;
    --container-gutter-tablet:  18px;
    --container-gutter-phone:   16px;
  }

  /* ── 深色外观（Apple 深色石墨阶，与设置页一致）────────────────── */
  :root[data-theme="dark"] {
    --bg: #1e1e1e;
    --surface: #272729;
    --surface-warm: #2a2a2c;
    --fg: #f5f5f7;
    --fg-2: #d2d2d7;
    --muted: #a1a1a6;
    --meta: #98989d;
    --border: #48484a;
    --border-soft: #3a3a3c;
    --accent: #2997ff;
    --accent-hover: #44a5ff;
    --accent-active: #6ab8ff;
    --success: #30d158;
    --warn:    #ffd60a;
    --danger:  #ff453a;
    --elev-raised: 0 12px 32px rgba(0, 0, 0, 0.4);
    --focus-ring: 0 0 0 4px color-mix(in oklab, var(--accent), transparent 72%);
  }

  body, .window, .titlebar, .sidebar, .list-col, .detail, .popover, .doc-card {
    transition: background-color var(--motion-base) var(--ease-standard),
                color var(--motion-base) var(--ease-standard),
                border-color var(--motion-base) var(--ease-standard);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    font-size: var(--text-sm);
    line-height: 1.7;
    color: var(--fg);
    background: #2a2a2c;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-6);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: none; box-shadow: var(--focus-ring);
  }

  /* ── Window chrome ───────────────────────────────────────────────── */
  .window {
    width: min(1440px, 100%);
    height: min(900px, calc(100vh - 48px));
    background: var(--bg);
    border-radius: var(--radius-md);
    box-shadow: 0 32px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .titlebar {
    height: 52px; flex: none;
    display: flex; align-items: center; gap: var(--space-3);
    padding: 0 var(--space-4) 0 88px;
    background: var(--surface-warm);
    border-bottom: 1px solid var(--border-soft);
    position: relative;
  }
  .traffic { position: absolute; left: 20px; display: flex; gap: 8px; }
  .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .traffic i:nth-child(1) { background: #ff5f57; }
  .traffic i:nth-child(2) { background: #febc2e; }
  .traffic i:nth-child(3) { background: #28c840; }
  .titlebar-title {
    font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.01em;
  }
  .titlebar-spacer { flex: 1; }

  .search {
    display: flex; align-items: center; gap: 6px;
    width: 240px; height: 30px; padding: 0 10px;
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    transition: box-shadow var(--motion-fast) var(--ease-standard);
  }
  .search:focus-within { box-shadow: var(--focus-ring); border-color: transparent; }
  .search svg { flex: none; color: var(--meta); }
  .search input {
    flex: 1; min-width: 0; border: none; background: none; outline: none;
    font: inherit; font-size: 13px; color: var(--fg);
  }
  .search input::placeholder { color: var(--meta); }

  .tool-btn {
    height: 30px; min-width: 30px; padding: 0 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 7px; color: var(--fg-2); font-size: 13px; font-weight: 500;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .tool-btn:hover { background: var(--border-soft); }
  .tool-btn:active { background: var(--border); }
  .tool-btn svg { display: block; }

  /* ── Body: 3 columns ─────────────────────────────────────────────── */
  .body { flex: 1; display: flex; min-height: 0; }

  /* Sidebar */
  .sidebar {
    width: 240px; flex: none;
    background: var(--surface);
    border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .sidebar-scroll { flex: 1; padding: var(--space-3) var(--space-2); }
  .side-section { margin-bottom: var(--space-5); }
  .side-heading {
    padding: 0 10px; margin-bottom: 2px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--muted);
  }
  .side-item {
    width: 100%; display: flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 10px; border-radius: 7px;
    font-size: 13px; color: var(--fg); text-align: left;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .side-item:hover:not(.active) { background: var(--border-soft); }
  .side-item.active { background: color-mix(in oklab, var(--accent), transparent 88%); color: var(--accent-active); font-weight: 500; }
  .side-item .glyph { width: 18px; flex: none; display: flex; justify-content: center; color: var(--muted); }
  .side-item.active .glyph { color: var(--accent-active); }
  .side-item .count { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .agent-mono {
    width: 18px; height: 18px; border-radius: 5px; flex: none;
    background: var(--fg); color: var(--bg);
    font-size: 9.5px; font-weight: 600; font-family: var(--font-display);
    display: flex; align-items: center; justify-content: center;
    letter-spacing: 0;
  }
  .sidebar-footer {
    flex: none; padding: var(--space-3); border-top: 1px solid var(--border-soft);
    display: flex; gap: var(--space-2);
  }
  .side-link {
    flex: 1; height: 28px; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: var(--fg-2); border-radius: 7px; text-decoration: none;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .side-link:hover { background: var(--border-soft); }

  /* Skill list column */
  .list-col {
    width: 400px; flex: none;
    border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column; min-height: 0;
    background: var(--bg);
  }
  .list-head {
    flex: none; height: 46px; display: flex; align-items: center; gap: var(--space-2);
    padding: 0 var(--space-4); border-bottom: 1px solid var(--border-soft);
  }
  .list-head h2 { font-size: var(--text-base); font-weight: 600; font-family: var(--font-display); line-height: 1.35; }
  .list-head .meta { font-size: 12px; color: var(--muted); }
  .list-scroll { flex: 1; overflow-y: auto; padding: var(--space-2); }

  .skill-row {
    width: 100%; display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 10px; border-radius: 10px; text-align: left;
    border: 1px solid transparent;
    transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
  }
  .skill-row:hover:not(.active) { background: var(--surface); }
  .skill-row.active {
    background: color-mix(in oklab, var(--accent), transparent 93%);
    border-color: color-mix(in oklab, var(--accent), transparent 70%);
  }
  .skill-tile {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: linear-gradient(160deg, #424245, #1d1d1f);
    color: #fff; font-family: var(--font-display); font-weight: 600; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .skill-row.active .skill-tile { background: linear-gradient(160deg, #2997ff, #0071e3); }
  .skill-main { flex: 1; min-width: 0; }
  .skill-name-line { display: flex; align-items: center; gap: 6px; }
  .skill-name { font-size: 13.5px; font-weight: 600; color: var(--fg); font-family: var(--font-display); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skill-desc {
    font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .skill-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; min-width: 0; }
  .agent-chip {
    font-size: 10.5px; font-weight: 500; color: var(--fg-2);
    background: var(--surface); border: 1px solid var(--border-soft);
    padding: 1px 7px; border-radius: var(--radius-pill);
    white-space: nowrap;
  }
  .skill-row.active .agent-chip { background: rgba(255,255,255,.7); border-color: transparent; }
  .badge-dot { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
  .badge-dot i { width: 6px; height: 6px; border-radius: 50%; display: block; }
  .badge-warn { color: #b45309; }
  .badge-warn i { background: var(--warn); }
  .badge-link { color: var(--muted); }
  .badge-link i { background: none; border: 1.5px solid var(--meta); border-radius: 2px; width: 5px; height: 5px; }

  .list-empty { padding: var(--space-12) var(--space-6); text-align: center; color: var(--muted); }
  .list-empty h3 { font-size: var(--text-base); font-weight: 600; color: var(--fg); margin-bottom: var(--space-2); line-height: 1.4; }
  .list-empty p { font-size: 13px; margin-bottom: var(--space-4); }
  .text-btn { color: var(--accent); font-size: 13px; font-weight: 500; border-radius: 6px; padding: 4px 8px; }
  .text-btn:hover { background: color-mix(in oklab, var(--accent), transparent 92%); }

  /* Detail column */
  .detail { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg); display: flex; flex-direction: column; }
  .detail-inner { max-width: 720px; margin: 0 auto; padding: var(--space-8) var(--space-8) var(--space-12); }

  .detail-hero { display: flex; gap: var(--space-5); align-items: flex-start; margin-bottom: var(--space-6); }
  .detail-tile {
    width: 72px; height: 72px; border-radius: var(--radius-lg); flex: none;
    background: linear-gradient(160deg, #424245, #1d1d1f);
    color: #fff; font-family: var(--font-display); font-weight: 600; font-size: 30px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--elev-raised);
  }
  .detail-hero-main { flex: 1; min-width: 0; }
  .detail-title { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 600; line-height: 1.3; letter-spacing: 0; }
  .detail-path {
    font-family: var(--font-mono); font-size: 12px; color: var(--muted);
    margin-top: 3px; word-break: break-all; line-height: 1.6;
  }
  .hero-badges { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
  .pill-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: var(--radius-pill);
  }
  .pill-link { color: var(--fg-2); background: var(--surface); border: 1px solid var(--border-soft); }
  .pill-warn { color: #b45309; background: color-mix(in oklab, var(--warn), transparent 85%); }

  .action-bar { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-8); }
  .btn {
    height: 32px; padding: 0 14px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .btn-secondary { background: var(--surface); color: var(--fg); box-shadow: var(--elev-ring); }
  .btn-secondary:hover { background: var(--border-soft); }
  .btn-secondary:active { background: var(--border); }
  .btn-destructive { background: none; color: var(--danger); }
  .btn-destructive:hover { background: color-mix(in oklab, var(--danger), transparent 92%); }
  .btn-primary { background: var(--accent); color: var(--accent-on); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { background: var(--accent-active); }
  .btn-danger-solid { background: var(--danger); color: #fff; }
  .btn-danger-solid:hover { background: #c81e1e; }

  .d-section { margin-bottom: var(--space-8); }
  .d-section > h3 {
    font-size: var(--text-sm); font-weight: 600; font-family: var(--font-display);
    line-height: 1.4; margin-bottom: var(--space-3);
    display: flex; align-items: center; gap: var(--space-2);
  }
  .src-badge {
    font-size: 10.5px; font-weight: 500; color: var(--muted);
    background: var(--surface); border: 1px solid var(--border-soft);
    padding: 1px 8px; border-radius: var(--radius-pill);
  }
  .d-body { font-size: var(--text-sm); color: var(--fg-2); line-height: 1.75; }
  .d-body p + p { margin-top: var(--space-2); }

  .doc-card {
    background: var(--surface-warm); border: 1px solid var(--border-soft);
    border-radius: var(--radius-md); overflow: hidden;
  }
  .doc-card-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px var(--space-4); border-bottom: 1px solid var(--border-soft);
    font-family: var(--font-mono); font-size: 11.5px; color: var(--muted);
  }
  .doc-card-body { padding: var(--space-4) var(--space-5); font-size: 13px; line-height: 1.75; color: var(--fg-2); }
  .doc-card-body h4 { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--fg); margin: var(--space-3) 0 var(--space-2); line-height: 1.4; }
  .doc-card-body h4:first-child { margin-top: 0; }
  .doc-card-body ul { padding-left: var(--space-5); margin: var(--space-2) 0; }
  .doc-card-body li { margin: 2px 0; }
  .doc-card-body code, .fm { font-family: var(--font-mono); font-size: 11.5px; }
  .doc-card-body code { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 4px; padding: 1px 5px; }
  .fm {
    display: block; background: var(--surface); border-bottom: 1px solid var(--border-soft);
    padding: var(--space-3) var(--space-5); color: var(--muted); white-space: pre; line-height: 1.7;
  }

  .kv-grid { display: grid; grid-template-columns: 108px 1fr; row-gap: 10px; column-gap: var(--space-4); font-size: 13px; }
  .kv-grid dt { color: var(--muted); }
  .kv-grid dd { color: var(--fg); word-break: break-all; line-height: 1.6; }
  .kv-grid dd.mono { font-family: var(--font-mono); font-size: 12px; }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .agent-chip-lg {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; color: var(--fg);
    background: var(--surface); border: 1px solid var(--border-soft);
    padding: 4px 12px 4px 5px; border-radius: var(--radius-pill);
  }
  .agent-chip-lg .agent-mono { width: 20px; height: 20px; font-size: 10px; }

  /* Detail empty state */
  .detail-empty {
    flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--muted); text-align: center; padding: var(--space-8); gap: var(--space-4);
  }
  .detail-empty img { width: 96px; height: 96px; opacity: .9; margin-bottom: var(--space-2); }
  .detail-empty h3 { font-size: var(--text-xl); font-weight: 600; color: var(--fg); line-height: 1.3; letter-spacing: 0; }
  .detail-empty p { font-size: var(--text-sm); max-width: 340px; color: var(--muted); line-height: 1.7; }

  /* Sort popover */
  .popover-wrap { position: relative; }
  .popover {
    position: absolute; top: 36px; right: 0; z-index: 40;
    min-width: 168px; padding: 5px;
    background: rgba(252,252,253,.96); backdrop-filter: blur(20px);
    border-radius: 10px; box-shadow: 0 10px 32px rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.06);
    display: none;
  }
  .popover.open { display: block; }
  .popover-title { font-size: 11px; font-weight: 600; color: var(--meta); padding: 5px 10px 3px; }
  .pop-item {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 6px; font-size: 13px; text-align: left;
  }
  .pop-item:hover { background: color-mix(in oklab, var(--accent), transparent 90%); }
  .pop-item .tick { width: 14px; color: var(--accent); font-weight: 700; visibility: hidden; }
  .pop-item.on .tick { visibility: visible; }

  /* Modal dialog */
  .overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0,0,0,.32);
    display: none; align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .dialog {
    width: 460px; max-width: calc(100vw - 64px);
    background: var(--bg); border-radius: var(--radius-lg);
    box-shadow: 0 24px 64px rgba(0,0,0,.3);
    padding: var(--space-6);
  }
  .dialog h3 { font-family: var(--font-display); font-size: var(--text-base); font-weight: 600; line-height: 1.4; margin-bottom: var(--space-2); }
  .dialog .dlg-desc { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: var(--space-4); }
  .op-route {
    background: var(--surface); border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4);
    font-family: var(--font-mono); font-size: 11.5px; line-height: 1.8; color: var(--fg-2);
    word-break: break-all;
  }
  .op-route .route-label { font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--meta); display: block; }
  .op-route .arrow { color: var(--meta); font-family: var(--font-body); }
  .dlg-actions { display: flex; justify-content: flex-end; gap: var(--space-2); }
  .target-row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); font-size: 13px; }
  .target-row select {
    flex: 1; height: 32px; padding: 0 10px; font: inherit; font-size: 13px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(16px);
    z-index: 80; background: rgba(29,29,31,.94); color: #f5f5f7;
    font-size: 13px; font-weight: 500; padding: 10px 18px; border-radius: var(--radius-pill);
    box-shadow: 0 12px 32px rgba(0,0,0,.3);
    opacity: 0; pointer-events: none;
    transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.28); }

  /* Theme toggle button — 亮色显示月亮（点击切深色），深色显示太阳 */
  #themeBtn .sun { display: none; }
  :root[data-theme="dark"] #themeBtn .sun { display: block; }
  :root[data-theme="dark"] #themeBtn .moon { display: none; }

  /* 深色组件覆盖 */
  :root[data-theme="dark"] .badge-warn { color: #f0a24d; }
  :root[data-theme="dark"] .pill-warn { color: #f0a24d; }
  :root[data-theme="dark"] .popover { background: rgba(43,43,45,.96); box-shadow: 0 10px 32px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.1); }
  :root[data-theme="dark"] .btn-danger-solid:hover { background: #ff5a4d; }
  :root[data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); }
  :root[data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.32); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="window" data-od-id="main-window">
  <!-- Title bar -->
  <header class="titlebar" data-od-id="titlebar">
    <span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="titlebar-title" id="crumb">全部 Skill</span>
    <span class="titlebar-spacer"></span>
    <div class="search" data-od-id="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="搜索 Skill" aria-label="搜索 Skill">
    </div>
    <div class="popover-wrap">
      <button class="tool-btn" id="sortBtn" aria-label="排序" aria-haspopup="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v13M7 4 4 7M7 4l3 3M17 20V7M17 20l3-3M17 20l-3-3"/></svg>
      </button>
      <div class="popover" id="sortPop" role="menu" data-od-id="sort-menu">
        <div class="popover-title">排序方式</div>
        <button class="pop-item on" data-sort="default"><span class="tick">✓</span>默认顺序</button>
        <button class="pop-item" data-sort="name"><span class="tick">✓</span>名称</button>
        <button class="pop-item" data-sort="path"><span class="tick">✓</span>路径</button>
      </div>
    </div>
    <button class="tool-btn" id="themeBtn" aria-label="切换深色模式" aria-pressed="false" data-od-id="theme-toggle">
      <svg class="moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </header>

  <div class="body">
    <!-- Sidebar -->
    <nav class="sidebar" data-od-id="sidebar" aria-label="浏览">
      <div class="sidebar-scroll" id="sidebarNav"></div>
      <div class="sidebar-footer">
        <a class="side-link" href="settings.html" data-od-id="open-settings">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          设置
        </a>
        <button class="side-link" id="addProjectBtn" data-od-id="add-project">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          添加项目
        </button>
      </div>
    </nav>

    <!-- Skill list -->
    <section class="list-col" data-od-id="skill-list" aria-label="Skill 列表">
      <div class="list-head">
        <h2 id="listTitle">全部 Skill</h2>
        <span class="meta" id="listCount"></span>
      </div>
      <div class="list-scroll" id="listScroll"></div>
    </section>

    <!-- Detail -->
    <section class="detail" data-od-id="skill-detail" aria-label="Skill 详情">
      <div id="detailHost" style="flex:1; display:flex; flex-direction:column; min-height:0"></div>
    </section>
  </div>
</div>

<!-- Operation dialog -->
<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" data-od-id="operation-dialog" id="dialog"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* ── Data (sample index reflecting a real local scan) ─────────────── */
const AGENTS = {
  claude:   { name: 'Claude Code', mono: 'CC' },
  codex:    { name: 'Codex',       mono: 'CX' },
  opencode: { name: 'OpenCode',    mono: 'OC' },
  cursor:   { name: 'Cursor',      mono: 'CU' },
  codebuddy:{ name: 'CodeBuddy',   mono: 'CB' },
  gemini:   { name: 'Gemini CLI',  mono: 'GE' },
};

const SKILLS = [
  { name: 'algorithmic-art', agents: ['claude'], scope: 'global', root: 'home',
    path: '~/.claude/skills/algorithmic-art/SKILL.md',
    desc: '使用 p5.js 创作算法艺术，支持种子随机与交互式参数探索。',
    src: 'SKILL.md', flags: [] },
  { name: 'docx', agents: ['claude', 'opencode'], scope: 'global', root: 'home',
    path: '~/.claude/skills/docx/SKILL.md',
    desc: '创建、读取与编辑 Word 文档：目录、标题、页码与修订跟踪。',
    src: '自定义简介', flags: [] },
  { name: 'pdf', agents: ['claude'], scope: 'global', root: 'home',
    path: '~/.claude/skills/pdf/SKILL.md',
    desc: 'PDF 文本与表格提取、合并拆分、旋转、表单填写与 OCR。',
    src: 'SKILL.md', flags: [] },
  { name: 'xlsx', agents: ['claude', 'codex'], scope: 'global', root: 'home',
    path: '~/.claude/skills/xlsx/SKILL.md',
    desc: '电子表格读写、公式计算、格式化与图表，兼容 .xlsx / .csv。',
    src: 'SKILL.md', flags: [] },
  { name: 'pptx', agents: ['claude'], scope: 'global', root: 'home',
    path: '~/.claude/skills/pptx/SKILL.md',
    desc: '创建与编辑演示文稿：版式、演讲备注、模板与批注。',
    src: 'SKILL.md', flags: [] },
  { name: 'canvas-design', agents: ['cursor'], scope: 'global', root: 'home',
    path: '~/.cursor/skills/canvas-design/SKILL.md',
    desc: '以设计哲学驱动创作海报与静态视觉作品，输出 PNG / PDF。',
    src: '可信补全', flags: [] },
  { name: 'firecrawl-scrape', agents: ['opencode'], scope: 'global', root: 'home',
    path: '~/.agents/skills/firecrawl-scrape/SKILL.md',
    desc: '将任意 URL 抓取为干净的 Markdown，支持 JS 渲染页面。',
    src: 'SKILL.md', flags: [] },
  { name: 'firecrawl-search', agents: ['opencode'], scope: 'global', root: 'home',
    path: '~/.agents/skills/firecrawl-search/SKILL.md',
    desc: '联网搜索并提取整页内容，返回完整页面而非摘要片段。',
    src: 'SKILL.md', flags: [] },
  { name: 'webapp-testing', agents: ['claude'], scope: 'global', root: 'home',
    path: '~/.claude/skills/webapp-testing/SKILL.md',
    desc: '使用 Playwright 与本地 Web 应用交互：验证功能、截图与日志。',
    src: 'SKILL.md', flags: [] },
  { name: 'skill-creator', agents: ['claude'], scope: 'global', root: 'home',
    path: '~/.claude/skills/skill-creator/SKILL.md',
    desc: '从零创建 Skill、改进现有 Skill 并评估触发准确率。',
    src: 'SKILL.md', flags: ['warn'] },
  { name: 'brooks-review', agents: ['opencode'], scope: 'project', root: 'skillselector',
    path: '~/Project/SkillSelector/.agents/skills/brooks-review/SKILL.md',
    target: '~/.agents/skills/brooks-lint/skills/brooks-review/SKILL.md',
    desc: 'PR 代码评审：以症状 → 根源 → 后果 → 对策输出衰减风险。',
    src: '自定义简介', flags: ['link'] },
  { name: 'brand-guidelines', agents: ['codebuddy', 'gemini'], scope: 'project', root: 'skillselector',
    path: '~/Project/SkillSelector/.codebuddy/skills/brand-guidelines/SKILL.md',
    desc: '为各类产出物应用官方品牌色与排版规范。',
    src: 'SKILL.md', flags: [] },
];

const ROOTS = {
  home:         { kind: 'home',    label: '用户主目录', path: '~' },
  skillselector:{ kind: 'project', label: 'SkillSelector', path: '~/Project/SkillSelector' },
};

const BODY_DOC = {
  default: [
    ['h4', '何时使用此 Skill'],
    ['p', '当任务匹配此 Skill 的触发条件时使用。详见上方 frontmatter 中的 description 字段。'],
    ['h4', '工作流程'],
    ['ul', ['读取入口文件并解析 frontmatter', '按步骤执行，引用 resources/ 下的模板', '完成后输出结构化结果']],
  ],
};

/* ── State ─────────────────────────────────────────────────────────── */
const state = {
  dest: { type: 'all' },
  search: '',
  sort: 'default',
  selected: null, // skill path
  deleted: new Set(),
};

const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const ICONS = {
  stack: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg>',
  globe: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg>',
  house: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  folder: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>',
};

function visibleSkills() {
  let list = SKILLS.filter((s) => !state.deleted.has(s.path));
  const d = state.dest;
  if (d.type === 'global') list = list.filter((s) => s.scope === 'global');
  else if (d.type === 'root') list = list.filter((s) => s.root === d.id);
  else if (d.type === 'agent') list = list.filter((s) => s.agents.includes(d.id));
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter((s) =>
      s.name.toLowerCase().includes(q) ||
      s.desc.toLowerCase().includes(q) ||
      s.path.toLowerCase().includes(q));
  }
  if (state.sort === 'name') list = [...list].sort((a, b) => a.name.localeCompare(b.name));
  else if (state.sort === 'path') list = [...list].sort((a, b) => a.path.localeCompare(b.path));
  return list;
}

function countFor(pred) {
  return SKILLS.filter((s) => !state.deleted.has(s.path) && pred(s)).length;
}

/* ── Sidebar ───────────────────────────────────────────────────────── */
function renderSidebar() {
  const agentIDs = Object.keys(AGENTS).filter((id) => countFor((s) => s.agents.includes(id)) > 0);
  const isActive = (pred) => pred() ? ' active' : '';
  $('#sidebarNav').innerHTML = `
    <div class="side-section">
      <button class="side-item${isActive(() => state.dest.type === 'all')}" data-dest="all" data-od-id="nav-all">
        <span class="glyph">${ICONS.stack}</span>全部 Skill
        <span class="count">${countFor(() => true)}</span>
      </button>
      <button class="side-item${isActive(() => state.dest.type === 'global')}" data-dest="global" data-od-id="nav-global">
        <span class="glyph">${ICONS.globe}</span>全局 Skill
        <span class="count">${countFor((s) => s.scope === 'global')}</span>
      </button>
    </div>
    <div class="side-section">
      <div class="side-heading">目录</div>
      <button class="side-item${isActive(() => state.dest.type === 'root' && state.dest.id === 'home')}" data-dest="root:home" data-od-id="nav-root-home">
        <span class="glyph">${ICONS.house}</span>用户主目录
        <span class="count">${countFor((s) => s.root === 'home')}</span>
      </button>
      <button class="side-item${isActive(() => state.dest.type === 'root' && state.dest.id === 'skillselector')}" data-dest="root:skillselector" data-od-id="nav-root-project">
        <span class="glyph">${ICONS.folder}</span>SkillSelector
        <span class="count">${countFor((s) => s.root === 'skillselector')}</span>
      </button>
    </div>
    <div class="side-section">
      <div class="side-heading">Agents</div>
      ${agentIDs.map((id) => `
        <button class="side-item${isActive(() => state.dest.type === 'agent' && state.dest.id === id)}" data-dest="agent:${id}" data-od-id="nav-agent-${id}">
          <span class="agent-mono">${AGENTS[id].mono}</span>${AGENTS[id].name}
          <span class="count">${countFor((s) => s.agents.includes(id))}</span>
        </button>`).join('')}
    </div>`;
  document.querySelectorAll('.side-item[data-dest]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.dest;
      if (v === 'all') state.dest = { type: 'all' };
      else if (v === 'global') state.dest = { type: 'global' };
      else if (v.startsWith('root:')) state.dest = { type: 'root', id: v.slice(5) };
      else state.dest = { type: 'agent', id: v.slice(6) };
      renderAll();
    });
  });
}

function destTitle() {
  const d = state.dest;
  if (d.type === 'all') return '全部 Skill';
  if (d.type === 'global') return '全局 Skill';
  if (d.type === 'root') return ROOTS[d.id].label;
  return AGENTS[d.id].name;
}

/* ── Skill list ────────────────────────────────────────────────────── */
const FLAG_BADGES = {
  warn: '<span class="badge-dot badge-warn"><i></i>诊断</span>',
  link: '<span class="badge-dot badge-link"><i></i>链接</span>',
};

function renderList() {
  const list = visibleSkills();
  $('#listTitle').textContent = destTitle();
  $('#crumb').textContent = 'SkillSelector — ' + destTitle();
  $('#listCount').textContent = list.length + ' 个';
  const host = $('#listScroll');

  if (!list.length) {
    host.innerHTML = `
      <div class="list-empty">
        <h3>${state.search ? '没有匹配的 Skill' : '此范围内暂无 Skill'}</h3>
        <p>${state.search ? '尝试修改搜索关键词或清除筛选条件。' : '添加项目文件夹或授权主目录以发现本地 Skill。'}</p>
        ${state.search ? '<button class="text-btn" id="clearSearch">清除搜索</button>' : ''}
      </div>`;
    const c = $('#clearSearch');
    if (c) c.addEventListener('click', () => { state.search = ''; $('#searchInput').value = ''; renderAll(); });
    return;
  }

  host.innerHTML = list.map((s) => `
    <button class="skill-row${state.selected === s.path ? ' active' : ''}"
            data-path="${esc(s.path)}" data-od-id="skill-row-${esc(s.name)}">
      <span class="skill-tile">${esc(s.name[0].toUpperCase())}</span>
      <span class="skill-main">
        <span class="skill-name-line">
          <span class="skill-name">${esc(s.name)}</span>
          ${s.flags.map((f) => FLAG_BADGES[f]).join('')}
        </span>
        <span class="skill-desc">${esc(s.desc)}</span>
        <span class="skill-meta">
          ${s.agents.map((a) => `<span class="agent-chip">${AGENTS[a].name}</span>`).join('')}
        </span>
      </span>
    </button>`).join('');

  host.querySelectorAll('.skill-row').forEach((row) => {
    row.addEventListener('click', () => {
      state.selected = row.dataset.path;
      renderList();
      renderDetail();
    });
  });
}

/* ── Detail ────────────────────────────────────────────────────────── */
function skillDocHTML(s) {
  const fm = `---\nname: ${s.name}\ndescription: ${s.desc}\n---`;
  const body = BODY_DOC.default.map(([tag, content]) => {
    if (tag === 'ul') return `<ul>${content.map((li) => `<li>${li}</li>`).join('')}</ul>`;
    return `<${tag}>${content}</${tag}>`;
  }).join('');
  return `
    <div class="doc-card" data-od-id="skill-doc">
      <div class="doc-card-head">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6z"/><path d="M14 3v6h6"/></svg>
        SKILL.md · 只读
      </div>
      <span class="fm">${esc(fm)}</span>
      <div class="doc-card-body">${body}</div>
    </div>`;
}

function renderDetail() {
  const host = $('#detailHost');
  const s = SKILLS.find((x) => x.path === state.selected && !state.deleted.has(x.path));
  if (!s) {
    host.innerHTML = `
      <div class="detail-empty">
        <img src="../assets/app-icon.svg" alt="SkillSelector 图标">
        <h3>选择一个 Skill</h3>
        <p>从左侧列表选择 Skill，查看其位置、来源、简介与文档内容。</p>
      </div>`;
    return;
  }

  const flagPills = {
    link: '<span class="pill-badge pill-link">软链接安装</span>',
    warn: '<span class="pill-badge pill-warn">frontmatter 解析警告</span>',
  };

  host.innerHTML = `
    <div class="detail-inner">
      <div class="detail-hero">
        <span class="detail-tile">${esc(s.name[0].toUpperCase())}</span>
        <div class="detail-hero-main">
          <h1 class="detail-title">${esc(s.name)}</h1>
          <div class="detail-path">${esc(s.path)}</div>
          ${s.flags.length ? `<div class="hero-badges">${s.flags.map((f) => flagPills[f]).join('')}</div>` : ''}
        </div>
      </div>

      <div class="action-bar" data-od-id="detail-actions">
        <button class="btn btn-secondary" data-op="reveal">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
          在 Finder 中显示
        </button>
        <button class="btn btn-secondary" data-op="copy">复制到…</button>
        <button class="btn btn-secondary" data-op="move">移动到…</button>
        <button class="btn btn-secondary" data-op="link">创建链接…</button>
        <span style="flex:1"></span>
        <button class="btn btn-destructive" data-op="delete">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          移到回收站
        </button>
      </div>

      <section class="d-section" data-od-id="detail-summary">
        <h3>核心作用 <span class="src-badge">来源：${esc(s.src)}</span></h3>
        <div class="d-body"><p>${esc(s.desc)}</p></div>
        <div style="margin-top:10px"><button class="text-btn" id="editDescBtn">编辑自定义简介</button></div>
        <div id="descEditor"></div>
      </section>

      <section class="d-section" data-od-id="detail-document">
        <h3>Skill 文档</h3>
        ${skillDocHTML(s)}
      </section>

      <section class="d-section" data-od-id="detail-agents">
        <h3>关联 Agents</h3>
        <div class="chip-row">
          ${s.agents.map((a) => `<span class="agent-chip-lg"><span class="agent-mono">${AGENTS[a].mono}</span>${AGENTS[a].name}</span>`).join('')}
        </div>
      </section>

      <section class="d-section" data-od-id="detail-locations">
        <h3>位置</h3>
        <dl class="kv-grid">
          <dt>层级</dt><dd>${s.scope === 'global' ? '全局（用户级）' : '项目级'}</dd>
          <dt>根目录</dt><dd class="mono">${esc(ROOTS[s.root].path)}</dd>
          <dt>安装路径</dt><dd class="mono">${esc(s.path)}</dd>
          ${s.target ? `<dt>链接目标</dt><dd class="mono">${esc(s.target)}</dd>` : ''}
          <dt>入口文件</dt><dd class="mono">SKILL.md</dd>
        </dl>
      </section>
    </div>`;

  host.querySelectorAll('[data-op]').forEach((btn) => {
    btn.addEventListener('click', () => openOperation(btn.dataset.op, s));
  });
  $('#editDescBtn').addEventListener('click', () => {
    $('#descEditor').innerHTML = `
      <div style="margin-top:10px">
        <textarea id="descInput" rows="3" style="width:100%;padding:10px 12px;font:inherit;font-size:13px;line-height:1.7;color:var(--fg);background:var(--surface-warm);border:1px solid var(--border);border-radius:var(--radius-sm);resize:vertical">${esc(s.desc)}</textarea>
        <div style="display:flex;gap:8px;margin-top:8px;justify-content:flex-end">
          <button class="btn btn-secondary" id="descCancel">取消</button>
          <button class="btn btn-primary" id="descSave">保存</button>
        </div>
      </div>`;
    $('#editDescBtn').style.display = 'none';
    $('#descInput').focus();
    $('#descCancel').addEventListener('click', renderDetail);
    $('#descSave').addEventListener('click', () => {
      s.desc = $('#descInput').value.trim() || s.desc;
      s.src = '自定义简介';
      toast('已保存自定义简介');
      renderAll();
    });
  });
}

/* ── Operations dialog ─────────────────────────────────────────────── */
const OP_COPY = {
  copy:  { title: '复制 Skill',      verb: '复制',  desc: '在目标目录创建一份独立的 Skill 副本，原 Skill 保持不变。' },
  move:  { title: '移动 Skill',      verb: '移动',  desc: '将 Skill 移动到目标目录，原位置不再保留。' },
  link:  { title: '创建软链接',      verb: '创建链接', desc: '在目标目录创建指向此 Skill 的软链接，作为独立安装记录。' },
};

function openOperation(op, s) {
  const overlay = $('#overlay');
  const dlg = $('#dialog');

  if (op === 'reveal') {
    toast('已在 Finder 中显示（原型演示）');
    return;
  }
  if (op === 'delete') {
    dlg.innerHTML = `
      <h3>将“${esc(s.name)}”移到回收站？</h3>
      <p class="dlg-desc">Skill 将被移入 macOS 回收站，可以从回收站恢复。此操作不会永久删除文件。</p>
      <div class="op-route"><span class="route-label">安装路径</span>${esc(s.path)}</div>
      <div class="dlg-actions">
        <button class="btn btn-secondary" data-close>取消</button>
        <button class="btn btn-danger-solid" id="dlgConfirm">移到回收站</button>
      </div>`;
    overlay.classList.add('open');
    $('#dlgConfirm').addEventListener('click', () => {
      state.deleted.add(s.path);
      if (state.selected === s.path) state.selected = null;
      overlay.classList.remove('open');
      toast('已移到回收站');
      renderAll();
    });
  } else {
    const meta = OP_COPY[op];
    const targets = Object.entries(ROOTS)
      .filter(([id]) => id !== s.root)
      .map(([id, r]) => `<option value="${id}">${r.label}（${r.path}）</option>`).join('');
    dlg.innerHTML = `
      <h3>${meta.title}</h3>
      <p class="dlg-desc">${meta.desc}</p>
      <div class="op-route">
        <span class="route-label">来源</span>${esc(s.path)}<br>
        <span class="route-label">目标</span><span id="routeTarget"></span>
      </div>
      <div class="target-row">
        <label for="targetSelect" style="color:var(--muted)">目标目录</label>
        <select id="targetSelect">${targets}</select>
      </div>
      <div class="dlg-actions">
        <button class="btn btn-secondary" data-close>取消</button>
        <button class="btn btn-primary" id="dlgConfirm">${meta.verb}</button>
      </div>`;
    overlay.classList.add('open');
    const sel = $('#targetSelect');
    const updateRoute = () => {
      const r = ROOTS[sel.value];
      $('#routeTarget').textContent = `${r.path}/.claude/skills/${s.name}/SKILL.md`.replace('/.claude', r.kind === 'project' ? '/.agents' : '/.claude');
    };
    sel.addEventListener('change', updateRoute);
    updateRoute();
    $('#dlgConfirm').addEventListener('click', () => {
      overlay.classList.remove('open');
      toast(`${meta.verb}完成（原型演示）`);
    });
  }
  dlg.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => overlay.classList.remove('open')));
}

$('#overlay').addEventListener('click', (e) => {
  if (e.target === $('#overlay')) $('#overlay').classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    $('#overlay').classList.remove('open');
    $('#sortPop').classList.remove('open');
  }
});

/* ── Toolbar behaviors ─────────────────────────────────────────────── */
$('#searchInput').addEventListener('input', (e) => {
  state.search = e.target.value.trim();
  renderList();
});

$('#sortBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  $('#sortPop').classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!$('#sortPop').contains(e.target) && e.target !== $('#sortBtn')) $('#sortPop').classList.remove('open');
});
document.querySelectorAll('#sortPop .pop-item').forEach((item) => {
  item.addEventListener('click', () => {
    state.sort = item.dataset.sort;
    document.querySelectorAll('#sortPop .pop-item').forEach((i) => i.classList.toggle('on', i === item));
    $('#sortPop').classList.remove('open');
    renderList();
  });
});

$('#addProjectBtn').addEventListener('click', () => {
  toast('打开目录选择面板（原型演示）');
});

/* ── Appearance: 深色 / 浅色切换（与设置页共用 ss.theme） ─────────── */
const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
function effectiveDark() {
  const mode = localStorage.getItem('ss.theme') || 'system';
  return mode === 'dark' || (mode === 'system' && systemDark.matches);
}
function updateThemeIcon() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#themeBtn').setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
  $('#themeBtn').setAttribute('aria-pressed', String(dark));
}
function paintTheme() {
  document.documentElement.dataset.theme = effectiveDark() ? 'dark' : 'light';
  updateThemeIcon();
}
$('#themeBtn').addEventListener('click', () => {
  localStorage.setItem('ss.theme', effectiveDark() ? 'light' : 'dark');
  paintTheme();
  toast(document.documentElement.dataset.theme === 'dark' ? '已切换为深色模式' : '已切换为浅色模式');
});
systemDark.addEventListener('change', () => {
  if ((localStorage.getItem('ss.theme') || 'system') === 'system') paintTheme();
});
paintTheme();

/* ── Toast ─────────────────────────────────────────────────────────── */
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ── Boot ──────────────────────────────────────────────────────────── */
function renderAll() {
  renderSidebar();
  renderList();
  renderDetail();
}
renderAll();
</script>
</body>
</html>
