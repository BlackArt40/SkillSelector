<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 428 96" role="img" aria-label="SkillSelector Logo">
  <defs>
    <linearGradient id="ss-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2997ff"/>
      <stop offset="1" stop-color="#0071e3"/>
    </linearGradient>
  </defs>

  <!-- Glyph: three stacked skill sheets, front one selected -->
  <g>
    <rect x="10" y="40" width="46" height="46" rx="12" fill="#d2d2d7"/>
    <rect x="25" y="25" width="46" height="46" rx="12" fill="#aeaeb2"/>
    <rect x="40" y="10" width="46" height="46" rx="12" fill="url(#ss-blue)"/>
    <path d="M52 33 L60 41 L74 26" fill="none" stroke="#ffffff" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="108" y="59"
        font-family="'SF Pro Display','SF Pro Icons','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="34" font-weight="600" letter-spacing="-0.5" fill="#1d1d1f">SkillSelector</text>
</svg>
