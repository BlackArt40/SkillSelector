<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="SkillSelector App Icon">
  <defs>
    <!-- macOS icon body: deep graphite to black -->
    <linearGradient id="icon-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3c"/>
      <stop offset="0.45" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <!-- subtle top sheen -->
    <linearGradient id="icon-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- front sheet blue -->
    <linearGradient id="sheet-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2997ff"/>
      <stop offset="1" stop-color="#0071e3"/>
    </linearGradient>
    <filter id="sheet-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body-clip">
      <rect x="112" y="112" width="800" height="800" rx="180"/>
    </clipPath>
  </defs>

  <!-- Icon body -->
  <rect x="112" y="112" width="800" height="800" rx="180" fill="url(#icon-bg)"/>
  <g clip-path="url(#body-clip)">
    <rect x="112" y="112" width="800" height="400" fill="url(#icon-sheen)"/>
  </g>

  <!-- Glyph: stacked skill sheets, front selected -->
  <g>
    <rect x="302" y="422" width="300" height="300" rx="70" fill="#ffffff" opacity="0.22"/>
    <rect x="362" y="362" width="300" height="300" rx="70" fill="#ffffff" opacity="0.5"/>
    <rect x="422" y="302" width="300" height="300" rx="70" fill="url(#sheet-blue)" filter="url(#sheet-shadow)"/>
    <path d="M496 446 L556 506 L652 392" fill="none" stroke="#ffffff" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
