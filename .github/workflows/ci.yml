name: CI

on:
  push:
    branches:
      - main
      - macos-12
  pull_request:
  schedule:
    # 03:00 Asia/Shanghai — nightly flake watch (five rounds below).
    - cron: "0 19 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (audit F-05: pin to SHA, Node 24)
      - name: Build
        run: |
          xcodebuild -version
          set -o pipefail
          swift build 2>&1 | tee /tmp/build-output.txt
      - name: Build failure annotations
        if: failure()
        run: |
          grep -E "error: " /tmp/build-output.txt | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          c=$(grep -cE "error: " /tmp/build-output.txt || true)
          echo "::error::total error lines: $c"
          exit 0
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/test-output.txt
      - name: Test failure annotations
        if: failure()
        run: |
          { awk '/Failing tests:/{f=8} f>0{print; f--}' /tmp/test-output.txt
            grep -E "^Executed [0-9]+ tests|error:" /tmp/test-output.txt | head -8
          } | sort -u | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          exit 0

  package:
    name: Package DMG (clean checkout)
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (audit F-05: pin to SHA, Node 24)
      - name: Package
        run: zsh Scripts/package-dmg.sh 0.0.0-ci
      - name: Smoke test
        run: zsh Tests/Packaging/package-smoke.sh 0.0.0-ci

  flake-watch:
    name: Flake watch (round ${{ matrix.round }})
    if: github.event_name == 'schedule'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (audit F-05: pin to SHA, Node 24)
      - name: Test
        run: swift test
