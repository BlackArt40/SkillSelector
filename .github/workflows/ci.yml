name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 03:00 Asia/Shanghai — nightly flake watch (five rounds below).
    - cron: "0 19 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0 (audit F-05: pin to SHA, Node 24)
      - name: Build
        run: |
          xcodebuild -version
          set -o pipefail
          swift build 2>&1 | tee /tmp/build-output.txt
      - name: Build failure annotations
        if: failure()
        run: |
          # Availability errors get their own bucket so they cannot crowd out
          # the other diagnostics under the 10-annotation display cap.
          c=$(grep -cE "error: " /tmp/build-output.txt || true)
          echo "::error::total error lines: $c"
          grep -E "error: " /tmp/build-output.txt | grep -v "is only available in macOS" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "error: " /tmp/build-output.txt | grep "is only available in macOS" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          exit 0
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/test-output.txt
      - name: Test failure annotations
        if: failure()
        run: |
          # Same shape as the build step: count first, then failing-test
          # names, then errors split into non-availability vs availability
          # buckets (this suite never prints "Executed N tests", so that
          # grep from the old shape is gone).
          c=$(grep -cE "error: " /tmp/test-output.txt || true)
          echo "::error::total error lines: $c"
          awk '/Failing tests:/{f=8} f>0{print; f--}' /tmp/test-output.txt | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "error: " /tmp/test-output.txt | grep -v "is only available in macOS" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "error: " /tmp/test-output.txt | grep "is only available in macOS" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          exit 0

  package:
    name: Package DMG (clean checkout)
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0 (audit F-05: pin to SHA, Node 24)
      - name: Package
        run: zsh Scripts/package-dmg.sh 0.0.0-ci
      - name: Smoke test
        run: zsh Tests/Packaging/package-smoke.sh 0.0.0-ci
      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2 (audit F-05: pin to SHA)
        with:
          name: SkillSelector-dmg-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  flake-watch:
    name: Flake watch (round ${{ matrix.round }})
    if: github.event_name == 'schedule'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0 (audit F-05: pin to SHA, Node 24)
      - name: Test
        run: swift test
