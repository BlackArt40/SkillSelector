name: CI

# Deployment target is macOS 14; CI runs on the current stable runner image.
# The runner image is Apple Silicon, so this also covers the arm64 slice that
# local development (x86_64) never exercises.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Nightly flake watch — a single green run is not proof of a healthy suite.
    - cron: "17 18 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -m
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  package:
    name: Package from a clean checkout
    # Guards against packaging inputs being silently excluded from version
    # control — a clean checkout must be able to produce a signed DMG.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: zsh Scripts/package-dmg.sh 0.0.0-ci

      - name: Packaging smoke test
        run: zsh Tests/Packaging/package-smoke.sh 0.0.0-ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkillSelector-ci-dmg
          path: |
            dist/SkillSelector-0.0.0-ci.dmg
            dist/SkillSelector-0.0.0-ci.dmg.sha256
          retention-days: 7

  flake-watch:
    name: Repeat test runs
    # SwiftData unique-constraint behaviour bit us once with a suite that was
    # green on a single run and red on the next. Repeat runs catch that class
    # of bug before a release does.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Run the suite five times
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5; do
            echo "::group::Round $round"
            swift test
            echo "::endgroup::"
          done
