name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:00 Asia/Shanghai — nightly flake watch (five rounds below).
    - cron: "0 19 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (audit F-05: pin to SHA, Node 24)
      - name: Build
        run: |
          xcodebuild -version
          set -o pipefail
          swift build 2>&1 | tee /tmp/build-output.txt
      - name: Build failure annotations
        if: failure()
        run: |
          # Availability errors get their own bucket so they cannot crowd out
          # the other diagnostics under the 10-annotation display cap.
          c=$(grep -cE "error: " /tmp/build-output.txt || true)
          echo "::error::total error lines: $c"
          grep -E "error: " /tmp/build-output.txt | grep -v "is only available in macOS" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "error: " /tmp/build-output.txt | grep "is only available in macOS" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          exit 0
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/test-output.txt
      - name: Test failure annotations
        if: failure()
        run: |
          # Same shape as the build step: count first, then failing-test
          # names, then errors split into non-availability vs availability
          # buckets (this suite never prints "Executed N tests", so that
          # grep from the old shape is gone).
          c=$(grep -cE "error: " /tmp/test-output.txt || true)
          echo "::error::total error lines: $c"
          awk '/Failing tests:/{f=8} f>0{print; f--}' /tmp/test-output.txt | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "error: " /tmp/test-output.txt | grep -v "is only available in macOS" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "error: " /tmp/test-output.txt | grep "is only available in macOS" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          exit 0

  package:
    name: Package DMG (clean checkout)
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (audit F-05: pin to SHA, Node 24)
      - name: Resolve version
        id: version
        run: |
          # Tag pushes (v*) package with the real version so the DMG name and
          # the bundle's CFBundleShortVersionString carry it; branch pushes
          # stay at the 0.0.0-ci placeholder.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-ci" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        run: zsh Scripts/package-dmg.sh "${{ steps.version.outputs.value }}"
      - name: Smoke test
        run: zsh Tests/Packaging/package-smoke.sh "${{ steps.version.outputs.value }}"
      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (audit F-05: pin to SHA)
        with:
          name: SkillSelector-dmg-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  flake-watch:
    name: Flake watch (round ${{ matrix.round }})
    if: github.event_name == 'schedule'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (audit F-05: pin to SHA, Node 24)
      - name: Test
        run: swift test

  screenshots:
    name: Regenerate README screenshots
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (audit F-05: pin to SHA, Node 24)
      - name: Build (debug)
        run: swift build
      - name: Capture en and zh-Hans
        run: |
          # DEBUG-only ScreenshotMode (audit F-06 / R11): renders every README
          # page against fixture skills and exits; the release binary has no
          # --screenshots entry point at all. The output directory must not
          # start with a dot — upload-artifact excludes hidden files.
          out="$PWD/screenshots-out"
          rm -rf "$out" && mkdir -p "$out"
          .build/debug/SkillSelector --screenshots "$out" --screenshot-language en
          .build/debug/SkillSelector --screenshots "$out" --screenshot-language zh-Hans
          test "$(ls "$out" | wc -l | tr -d ' ')" = 16
      - name: Upload screenshots artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (audit F-05: pin to SHA)
        with:
          name: SkillSelector-screenshots-${{ github.sha }}
          path: screenshots-out
          if-no-files-found: error
          retention-days: 7
